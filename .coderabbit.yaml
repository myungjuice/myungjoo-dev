# CodeRabbit 설정 — myungjoo.dev
# 스키마: https://docs.coderabbit.ai/reference/yaml-template
language: 'ko-KR'
tone_instructions: '한국어로 간결하고 실용적으로 리뷰하세요. 타입 안전성, i18n 텍스트 하드코딩(ko/en 번역 키 누락), 접근성, .claude/rules 컨벤션 위반을 우선 지적하세요.'

reviews:
  profile: assertive # 더 꼼꼼한 피드백 (사소한 지적 포함). 부담되면 chill로.
  request_changes_workflow: false
  high_level_summary: true # PR 설명에 변경 요약 자동 생성
  poem: false # 하이쿠/시 비활성화 (노이즈 감소)

  auto_review:
    enabled: true
    drafts: false # Draft PR은 리뷰 안 함
    base_branches:
      - develop
      - main

  # 리뷰/스파스체크아웃 제외 (빌드 산출물·의존성·자동 생성 파일 등)
  path_filters:
    - '!**/node_modules/**'
    - '!.next/**'
    - '!out/**'
    - '!coverage/**'
    - '!pnpm-lock.yaml'
    - '!next-env.d.ts'
    - '!**/*.tsbuildinfo'
    - '!.husky/_/**'
    - '!public/**'

  # 경로별 리뷰 가이드 — 프로젝트 룰(.claude/rules)을 반영
  path_instructions:
    - path: 'src/app/**'
      instructions: >
        Next.js App Router 페이지. 페이지 전용 컴포넌트는 해당 페이지 폴더의
        _components/에 위치해야 함. 서버 컴포넌트가 기본이며 'use client'는 상태/이벤트가
        필요한 최소 범위에만 사용. 서버 사이드 언어 감지는 getLangFromCookie() 사용.
        사용자에게 노출되는 텍스트는 하드코딩 금지 — i18n 번역 키(ko/en)로 처리.

    - path: 'src/store/**'
      instructions: >
        Zustand 스토어. 반드시 src/store/index.ts의 createStore 팩토리로 생성하고,
        export하는 훅은 useShallow selector 패턴을 따를 것. localStorage 영속화(withPersist)는
        꼭 필요한 경우에만. 서버 데이터를 스토어에 복제하지 말 것.

    - path: 'src/components/**'
      instructions: >
        공용 컴포넌트. .claude/rules/code.md 기준: 이른 추상화 금지(사용 사례가 달라질
        가능성이 있으면 중복 허용), props 드릴링 대신 컴포지션(children)·Context 사용,
        역할/상태가 크게 다른 조건부 UI는 별도 컴포넌트로 분리. ui/는 shadcn/ui(Radix 기반)
        컨벤션을 따르고 임의 수정 지양.

    - path: '**/*.{ts,tsx}'
      instructions: >
        TypeScript strict 준수, any 남용 금지. 매직 넘버는 이름 붙은 상수로 대체.
        광범위한 훅 대신 책임이 명확한 작은 훅으로 분리. 숨은 사이드 이펙트 금지
        (함수명이 동작을 정확히 설명). 파일은 타입별이 아닌 기능/도메인 단위로 구성.
        Tailwind 조건부 클래스는 cn() 사용, 인라인 style 지양.

chat:
  auto_reply: true
